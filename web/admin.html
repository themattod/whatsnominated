<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whatsnominated admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32-v2.png?v=20260217-2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16-v2.png?v=20260217-2" />
    <link rel="shortcut icon" href="/favicon-v2.png?v=20260217-2" />
    <link rel="stylesheet" href="/styles.css?v=20260309-3" />
  </head>
  <body class="admin-page">
    <main class="app-shell">
      <header class="app-header admin-header">
        <div class="brand-block">
          <img class="brand-logo" src="/assets/header-logo.png" alt="whatsnominated logo" />
          <div class="brand-copy">
            <p class="eyebrow">Admin</p>
            <h1>WhatsNominated</h1>
            <p class="subtitle">Manage global settings, films, live controls, and pool tools.</p>
          </div>
        </div>
        <div class="admin-header-actions">
          <a class="button-link" href="/admin-audit.html">Audit Logs</a>
          <button type="button" id="adminLogoutButton">Log Out</button>
        </div>
      </header>

      <div class="admin-workspace">
        <aside class="control-card admin-sidebar-nav" aria-label="Admin sections">
          <p class="control-title">Admin Menu</p>
          <div class="admin-sidebar-menu">
            <button type="button" class="admin-nav-button" data-section="global">Global Controls</button>
            <button type="button" class="admin-nav-button" data-section="film">Film Controls</button>
            <button type="button" class="admin-nav-button" data-section="live">Live Controls</button>
            <button type="button" class="admin-nav-button" data-section="pool">Pool Controls</button>
          </div>
        </aside>

        <section class="admin-main-content">
          <section id="adminGlobalSection" class="admin-section-panel">
            <div class="control-card">
              <p class="control-title">Dashboard</p>
              <dl id="adminDashboard" class="admin-dashboard">
                <div><dt>Unique Users</dt><dd id="dashUniqueUsers">0</dd></div>
                <div><dt>Users Compared</dt><dd id="dashUsersCompared">0</dd></div>
                <div><dt>Total Picks</dt><dd id="dashTotalPicks">0</dd></div>
                <div><dt>Winner Categories</dt><dd id="dashWinnerCategories">0</dd></div>
              </dl>
            </div>
            <div class="control-card banner-sticky-card">
              <p class="control-title">Banner Controls</p>
              <form id="bannerForm" class="banner-form banner-form-inline">
                <div class="banner-actions">
                  <button type="button" id="bannerEnabledButton" aria-pressed="true">Banner Enabled</button>
                  <button type="submit" id="bannerSaveButton">Save Banner</button>
                </div>
                <textarea id="bannerText" rows="2" placeholder="Banner text" aria-label="Banner text"></textarea>
                <p id="bannerSaveStatus" class="banner-save-status" aria-live="polite"></p>
              </form>
            </div>
          </section>

          <section id="adminFilmSection" class="admin-section-panel" hidden>
            <div class="control-card">
              <p class="control-title">Browse Films</p>
              <div class="control-grid ballot-grid">
                <label id="yearControl">
                  Year
                  <select id="yearSelect"></select>
                </label>

                <label>
                  Jump to Category
                  <select id="ballotJumpSelect"></select>
                </label>
              </div>
            </div>
            <section class="stats" id="stats"></section>
            <section id="filmList" class="film-list" aria-live="polite"></section>
          </section>

          <section id="adminLiveSection" class="admin-section-panel" hidden>
            <div class="control-card voting-controls-card">
              <p class="control-title">Voting Controls</p>
              <div class="admin-mode-actions">
                <button type="button" id="votingLockHeaderButton">Lock Voting</button>
                <button type="button" id="eventModeHeaderButton">Enable Live Mode</button>
                <button type="button" id="clearWinnersButton" disabled>Clear Winners</button>
                <p id="eventModeSaveStatus" class="banner-save-status" aria-live="polite"></p>
              </div>
            </div>
            <div class="control-card">
              <p class="control-title">Browse Categories</p>
              <div class="control-grid ballot-grid">
                <label id="yearControlLive">
                  Year
                  <select id="yearSelectLive"></select>
                </label>

                <label>
                  Jump to Category
                  <select id="ballotJumpSelectLive"></select>
                </label>
              </div>
            </div>
            <section class="stats" id="liveStats"></section>
            <section id="liveFilmList" class="film-list" aria-live="polite"></section>
          </section>

          <section id="adminPoolSection" class="admin-section-panel" hidden>
            <div class="control-card">
              <p class="control-title">Pool Troubleshooting</p>
              <form id="poolTroubleshootForm" class="pools-row">
                <label class="compact">
                  Pool ID
                  <input id="poolTroubleshootPoolId" type="text" placeholder="Exact pool id" />
                </label>
                <label class="compact">
                  User Email
                  <input id="poolTroubleshootUserEmail" type="email" placeholder="member@example.com" />
                </label>
                <button type="submit">Search Pools</button>
                <button type="button" id="poolTroubleshootReset">Reset</button>
              </form>
              <p id="poolTroubleshootStatus" class="banner-save-status" aria-live="polite"></p>
              <div id="poolTroubleshootResults"></div>
            </div>
          </section>
        </section>
      </div>
    </main>

    <template id="adminFormTemplate">
      <form class="admin-form">
        <h3>Admin Overrides</h3>
        <label>
          <span>Where to Watch URL</span>
          <div class="watch-label-toggle">
            <input type="checkbox" name="freeToWatch" />
            <span>Free to Watch</span>
          </div>
          <input type="url" name="whereToWatchUrl" />
        </label>
        <label>Poster URL <input type="url" name="posterUrl" /></label>
        <div class="admin-actions">
          <button type="submit">Save</button>
          <button type="button" class="clear-override-button">Clear watch override</button>
          <button type="button" class="clear-poster-button">Clear poster override</button>
        </div>
      </form>
    </template>

    <script type="module" src="/admin.js?v=20260309-3"></script>
    <script src="/analytics-config.js?v=20260309-3"></script>
    <script src="/analytics.js?v=20260309-3"></script>
  </body>
</html>
